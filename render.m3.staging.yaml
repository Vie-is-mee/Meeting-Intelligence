# Mission 3 C2 staging Blueprint — point Render Blueprint at this exact filename.
# Separate service; NEVER reuses the production M2 service name or branch.
services:
  - type: web
    name: meeting-intelligence-m3-staging
    repo: https://github.com/Vie-is-mee/Meeting-Intelligence
    branch: mission3/improvement-20261021
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python -X utf8 web.py --host 0.0.0.0 --public
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_JSON_MODE
        value: "true"
      - key: LLM_STRUCTURED_OUTPUTS
        value: auto
      - key: LLM_MAX_COMPLETION_TOKENS
        value: "2560"
      - key: LLM_TEMPERATURE
        value: "0.6"
      - key: LLM_REASONING_EFFORT
        value: low
      - key: ENABLE_LIVE_API
        value: "true"
      - key: ALLOWED_ORIGINS
        value: ""
